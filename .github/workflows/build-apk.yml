name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          DETECTED_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$DETECTED_VERSION" ]; then
            echo "ERROR: Failed to detect Java version from output." >&2
            exit 1
          fi
          echo "Detected full Java version: $DETECTED_VERSION"
          JAVA_MAJOR=$(echo "$DETECTED_VERSION" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Active Java major version could not be parsed as a number: $JAVA_MAJOR" >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version must be 17 or newer. Found: $JAVA_MAJOR" >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Keystore ./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore was not created successfully." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Available APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is an empty file." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension." >&2
              exit 1
              ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}/release_assets"
          mkdir -p "$RUNNER_TMP_DIR"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${RUNNER_TMP_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $TARGET_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is invalid, missing, or empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset $ASSET_PATH does not have .apk extension." >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_BODY=$(cat <<EOF
          ### Debug APK Build
          - **Build Type:** Automatically generated debug APK
          - **Built by:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Testing Notice:** This APK is intended for testing and is not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Direct Release URL: $RELEASE_URL"
            echo "=========================================================="

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built successfully** and published to GitHub Releases!"
              echo ""
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Direct Download Asset:** \`$ASSET_NAME\` (available under the release **Assets** section)"
              echo "- **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also stored and available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            echo "Artifact Name: app-debug-apk"

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK built and verified successfully!**"
              echo ""
              echo "⚠️ **GitHub Release publishing was not completed.**"
              echo "The compiled debug APK is safely preserved as a GitHub Actions artifact:"
              echo "- **Artifact Name:** \`app-debug-apk\`"
              echo "- You can download this artifact directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
